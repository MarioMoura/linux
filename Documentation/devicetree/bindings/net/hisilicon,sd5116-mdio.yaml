%YAML 1.2
---
$id: http://devicetree.org/schemas/net/hisilicon,sd5116-mdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon SD5116 MDIO controller

maintainers:
  - Mario Moura <mm@mariomoura.com>

allOf:
  - $ref: mdio.yaml#

properties:
  compatible:
    const: hisilicon,sd5116-mdio

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    mdio@14600000 {
        compatible = "hisilicon,sd5116-mdio";
        reg = <0x14600000 0x20>;
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@1 {
            reg = <1>;
        };
    };
